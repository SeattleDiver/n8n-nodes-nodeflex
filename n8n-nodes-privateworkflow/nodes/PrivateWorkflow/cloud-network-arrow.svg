<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cloud network icon with a shortened bold dark gray arrow overlaid">
  <!-- BACKGROUND LAYER: Cloud and Network (Centered at x=136) -->
  <g>
    <!-- Cloud outline -->
    <path d="M176 128H96
             a36 36 0 0 1-6.6-71
             A52 52 0 0 1 192 76
             a28 28 0 0 1-16 52Z"
          fill="none"
          stroke="#00C896"
          stroke-width="18"
          stroke-linecap="butt"
          stroke-linejoin="miter"/>

    <!-- Vertical line from cloud center to the horizontal bar -->
    <line x1="136" y1="128" x2="136" y2="160"
          stroke="#00C896"
          stroke-width="18"
          stroke-linecap="butt"/>

    <!-- Local horizontal network bar -->
    <line x1="55" y1="160" x2="217" y2="160"
          stroke="#00C896"
          stroke-width="18"
          stroke-linecap="butt"/>

    <!-- Three symmetrical vertical stems -->
    <line x1="64" y1="160" x2="64" y2="194"
          stroke="#00C896" stroke-width="18" stroke-linecap="butt"/>
    <line x1="136" y1="160" x2="136" y2="194"
          stroke="#00C896" stroke-width="18" stroke-linecap="butt"/>
    <line x1="208" y1="160" x2="208" y2="194"
          stroke="#00C896" stroke-width="18" stroke-linecap="butt"/>

    <!-- Three squared hollow nodes -->
    <rect x="44" y="194" width="40" height="40"
          fill="none" stroke="#00C896" stroke-width="12" stroke-linejoin="miter"/>
    <rect x="116" y="194" width="40" height="40"
          fill="none" stroke="#00C896" stroke-width="12" stroke-linejoin="miter"/>
    <rect x="188" y="194" width="40" height="40"
          fill="none" stroke="#00C896" stroke-width="12" stroke-linejoin="miter"/>
  </g>

  <!-- FOREGROUND LAYER: Arrow (Shortened, moved left, colored #444) -->
  <g>
    <!-- White "Halo" border (36px wide) to provide contrast over the background -->
    <path d="M0 128 H90 M40 78 L90 128 L40 178"
          fill="none"
          stroke="#FFFFFF"
          stroke-width="36"
          stroke-linecap="butt"
          stroke-linejoin="miter"/>
    
    <!-- Bold Arrow (Stroke 22px, Color #444) -->
    <path d="M0 128 H90 M40 78 L90 128 L40 178"
          fill="none"
          stroke="#444"
          stroke-width="22"
          stroke-linecap="butt"
          stroke-linejoin="miter"/>
  </g>
</svg>