<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hollow cloud icon with sticker-style download arrow and wide letter tray shifted down">
  <!-- BACKGROUND: Hollow Cloud and Network -->
  <g id="network-background">
    <!-- Cloud outline -->
    <path d="M168 128H88
             a36 36 0 0 1-6.6-71
             A52 52 0 0 1 192 76
             a28 28 0 0 1-16 52Z"
          fill="none"
          stroke="#00C896"
          stroke-width="19"
          stroke-linecap="butt"
          stroke-linejoin="miter"/>

    <!-- Vertical line from cloud center -->
    <line x1="128" y1="128" x2="128" y2="160"
          stroke="#00C896"
          stroke-width="15"
          stroke-linecap="butt"/>

    <!-- Horizontal network bar -->
    <line x1="48.5" y1="160" x2="207.5" y2="160"
          stroke="#00C896"
          stroke-width="15"
          stroke-linecap="butt"/>

    <!-- Three symmetrical vertical stems -->
    <line x1="56" y1="160" x2="56" y2="194"
          stroke="#00C896" stroke-width="15" stroke-linecap="butt"/>
    <line x1="128" y1="160" x2="128" y2="194"
          stroke="#00C896" stroke-width="15" stroke-linecap="butt"/>
    <line x1="200" y1="160" x2="200" y2="194"
          stroke="#00C896" stroke-width="15" stroke-linecap="butt"/>

    <!-- Three squared hollow nodes -->
    <rect x="36" y="194" width="40" height="40"
          fill="none" stroke="#00C896" stroke-width="11" stroke-linejoin="miter"/>
    <rect x="108" y="194" width="40" height="40"
          fill="none" stroke="#00C896" stroke-width="11" stroke-linejoin="miter"/>
    <rect x="180" y="194" width="40" height="40"
          fill="none" stroke="#00C896" stroke-width="11" stroke-linejoin="miter"/>
  </g>

  <!-- TRAY: Desk Letter Tray with Sticker Border (Lowered 20px) -->
  <g id="download-tray">
    <!-- White Sticker Halo for the Tray (20px border) -->
    <!-- Path Shifted: Top at y=170, Bottom at y=190, Notch at y=180 -->
    <path d="M75.5 170 V190 H180.5 V170 H158 V180 H98 V170 Z" 
          fill="#FFFFFF" 
          stroke="#FFFFFF" 
          stroke-width="20" 
          stroke-linejoin="miter" />
    <!-- Solid Tray Body (Dark Gray #444) -->
    <path d="M75.5 170 V190 H180.5 V170 H158 V180 H98 V170 Z" 
          fill="#444" />
  </g>

  <!-- FOREGROUND: Sticker-style Download Arrow -->
  <g id="download-arrow-sticker">
    <!-- White Sticker Halo (20px border) -->
    <path d="M107.5 24 H148.5 V65 H180.5 L128 128.5 L75.5 65 H107.5 Z" 
          fill="#FFFFFF" 
          stroke="#FFFFFF" 
          stroke-width="20" 
          stroke-linejoin="miter" />
          
    <!-- Main Arrow Body (Dark Gray #444) -->
    <path d="M107.5 24 H148.5 V65 H180.5 L128 128.5 L75.5 65 H107.5 Z" 
          fill="#444" />
  </g>
</svg>