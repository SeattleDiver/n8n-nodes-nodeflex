<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Symmetrical solid network cloud icon">
  <!-- Solid Cloud Infill -->
  <path d="M168 128H88
           a36 36 0 0 1-6.6-71
           A52 52 0 0 1 184 76
           a28 28 0 0 1-16 52Z"
        fill="#00C896" />

  <!-- Network Connections (Solid lines 15px wide) -->
  <g stroke="#00C896" stroke-width="15" stroke-linecap="butt">
    <!-- Vertical line from cloud center -->
    <line x1="128" y1="128" x2="128" y2="160" />

    <!-- Local horizontal network bar (Flush with outer edges of stems) -->
    <line x1="48.5" y1="160" x2="207.5" y2="160" />

    <!-- Three symmetrical vertical stems -->
    <line x1="56" y1="160" x2="56" y2="194" />
    <line x1="128" y1="160" x2="128" y2="194" />
    <line x1="200" y1="160" x2="200" y2="194" />
  </g>

  <!-- Three solid squared nodes (40x40) -->
  <rect x="36" y="194" width="40" height="40" fill="#00C896" />
  <rect x="108" y="194" width="40" height="40" fill="#00C896" />
  <rect x="180" y="194" width="40" height="40" fill="#00C896" />
</svg>