<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Solid cloud download icon with #444 arrow and sticker border">
  <!-- BACKGROUND: Solid Cloud (Centered at x=128) -->
  <path d="M168 128H88
           a36 36 0 0 1-6.6-71
           A52 52 0 0 1 184 76
           a28 28 0 0 1-16 52Z"
        fill="#00C896" />

  <!-- NETWORK: Solid Connections and Nodes -->
  <g fill="#00C896">
    <!-- Horizontal network bar -->
    <rect x="48.5" y="152.5" width="159" height="15" />
    
    <!-- Three vertical stems (15px wide) -->
    <rect x="48.5" y="160" width="15" height="34" />
    <rect x="120.5" y="128" width="15" height="66" />
    <rect x="192.5" y="160" width="15" height="34" />

    <!-- Three solid squared nodes (40x40) -->
    <rect x="36" y="194" width="40" height="40" />
    <rect x="108" y="194" width="40" height="40" />
    <rect x="180" y="194" width="40" height="40" />
  </g>

  <!-- FOREGROUND: Sticker-style Download Arrow -->
  <g>
    <!-- White Sticker Halo (Thick stroke to create the border effect) -->
    <path d="M113 37 H143 V71 H166 L128 114 L90 71 H113 Z" 
          fill="#FFFFFF" 
          stroke="#FFFFFF" 
          stroke-width="18" 
          stroke-linejoin="miter" />
          
    <!-- Main Arrow Body (Dark Gray #444) -->
    <path d="M113 37 H143 V71 H166 L128 114 L90 71 H113 Z" 
          fill="#444" />
  </g>
</svg>